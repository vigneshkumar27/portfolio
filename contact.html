<div class="main">
<h1>Contact Me</h1>

<form id="contact-form" onsubmit="sendMsg(); return false;">
    <label>Name:</label>
    <input type="text" name="name">
    <label>Email:</label>
    <input type="text" name="email">
    <label>Message:</label>
    <textarea rows="5"></textarea>
    <input type="submit" value="Send">
</form>

<p id="ack" style="color:green; font-weight:bold"></p>

<script>
function sendMsg() {
    document.getElementById("ack").innerHTML = "Thank you! Your message is sent.";
}
</script>
